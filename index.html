<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Safari's bottom strip: white while browsing, like the page at both ends. The menu
         and the gallery viewer change it while they are open (theme-color.ts). -->
    <meta name="theme-color" content="#ffffff" />
    <!-- Painted before the stylesheets load, so the first frame is already the page's
         white (style.css repeats this). -->
    <style>
      html { background: #fff; }
      #app { min-height: 100vh; min-height: 100dvh; background: #fff; }
      @media (max-width: 768px) { body { background: transparent; } }
      html.is-veiled body::after { content: ""; position: fixed; inset: 0; height: 100lvh; background: #fff; z-index: 2147483647; }
    </style>
    <!-- Phones: a page opened from a navigation link starts under the white veil with the
         loader (page-transition.ts), so the page renders out of sight. -->
    <script>
      try {
        if (matchMedia('(max-width: 768px)').matches && sessionStorage.getItem('page-veil'))
          document.documentElement.classList.add('is-veiled');
      } catch (e) {}
    </script>
    <title>Café du Conservatoire</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Café Conservatoire" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      history.scrollRestoration = "manual";
      window.scrollTo(0, 0);
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
